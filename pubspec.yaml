name: examguard

version: 1.0.0+1
environment:
  sdk: '>=3.0.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  firebase_core: 3.8.0
  firebase_auth: ^5.3.3
  cloud_firestore: ^5.5.0
  camera: ^0.10.5+9
  cupertino_icons: ^1.0.2
  shared_preferences: ^2.0.15
  image_picker: ^1.1.2
  firebase_storage: ^12.3.6
  firebase_analytics: ^11.3.5
  image_cropper: ^8.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_launcher_icons: ^0.14.2
  flutter_lints: ^5.0.0

flutter_icons:
  android: true
  ios: true
  image_path: "assets/examlogo.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true
  assets:
    - assets/examlogo.png













